name: benchmark-tooling

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: benchmark-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-c-origin-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch benchmark refs
        run: |
          git fetch --no-tags origin pure-c stdc++

      - name: Install dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make jq python3

      - name: Run pure-c origin profile
        run: |
          ./benchmark_tools/run_benchmark.sh --branch pure-c-origin

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pure-c-benchmark-artifacts
          path: |
            benchmark_history.csv
            benchmark_report.md
            benchmark_tools/raw_logs/

  stdcpp-origin-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch benchmark refs
        run: |
          git fetch --no-tags origin pure-c stdc++

      - name: Install dependencies
        timeout-minutes: 12
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make jq python3 g++ libntl-dev

      - name: Run stdc++ origin profile in strict mode
        run: |
          ./benchmark_tools/run_benchmark.sh --strict --branch stdc++-origin
